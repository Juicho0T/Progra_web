{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="{% static 'usuarios/css/estilos.css' %}">
</head>
<body>
    <div class="contenedor">
        <h1>Control de Usuarios</h1>
        <h2>Inicio de sesión</h2>

        {% if error %}
            <script>
                alert("{{ error|escapejs }}");
            </script>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">
                Usuario
            </label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingrese su usuario"
                required
            >

            <label for="password">
                Contraseña
            </label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingrese su contraseña"
                required
            >

            <button type="submit">
                Ingresar
            </button>
        </form>

        <div class="pie">
            Práctica 05 - Django MVT
        </div>
    </div>
</body>
</html>
